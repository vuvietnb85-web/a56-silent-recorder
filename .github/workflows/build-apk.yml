name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Prepare named APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/A56-Ghi-Am-${{ github.ref_name }}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: A56-Ghi-Am-${{ github.ref_name }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
          body: |
            APK debug đã được ký tự động để cài đặt trực tiếp trên Android.

            Ứng dụng chạy ngoại tuyến và cần quyền microphone khi mở lần đầu.

